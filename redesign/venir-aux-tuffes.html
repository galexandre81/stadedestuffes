            "name": "Le stade est-il accessible librement ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Le stade nordique des Tuffes est la propriété du CNSNMM (Centre National de Ski Nordique et de Moyenne Montagne). L'accès n'est pas libre en permanence : il dépend de l'occupation du site (entraînements des équipes nationales, stages, compétitions). Le CNSNMM ouvre régulièrement des créneaux au grand public et l'accès aux abords est libre l'été tant que les pistes ne sont pas enneigées."

          },
          {
            "@type": "Question",

            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pour la majorité des épreuves, l'entrée est gratuite. La billetterie ne concerne que les grands événements internationaux (Coupes du Monde). Vérifiez auprès de la source officielle de chaque compétition."
            }
          },
          {
            "@type": "Question",
            "name": "Peut-on s'entraîner sur le stade en dehors des compétitions ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "L'accès aux installations techniques (pas de tir, tremplins) est strictement réservé aux licenciés via leur club et aux stages encadrés par le CNSNMM. Pour le ski de fond sur le domaine, les pistes sont accessibles via le forfait nordique de l'Espace Loisirs des Rousses."
            }
          },
          {
            "@type": "Question",
            "name": "Quelles activités l'été ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Randonnée et VTT sur les sentiers du massif jurassien. Le stade héberge des compétitions de ski-roues et de saut à ski d'été ainsi que les stages nationaux d'été du CNSNMM."
            }
          },
          {
            "@type": "Question",
            "name": "Comment venir depuis la Suisse ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Le stade se trouve à 20 minutes à pied de la gare de La Cure (canton de Vaud), terminus de la ligne CFF NStCM depuis Nyon. C'est l'option la plus simple si vous arrivez en train depuis Genève ou Lausanne. En voiture, comptez moins d'une heure depuis l'aéroport de Genève par Nyon et le col de la Givrine."
            }
